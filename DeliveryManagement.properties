spring.application.name=DeliveryManagement

server.port=8084

spring.datasource.username=root
spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=*

# Circuit Breaker - Product Service
resilience4j.circuitbreaker.instances.deliveryCB.registerHealthIndicator=true

# Sliding Window Configuration
resilience4j.circuitbreaker.instances.deliveryCB.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.deliveryCB.slidingWindowSize=10

# Failure Threshold
resilience4j.circuitbreaker.instances.deliveryCB.failureRateThreshold=50

# Minimum calls required
resilience4j.circuitbreaker.instances.deliveryCB.minimumNumberOfCalls=5

# Wait duration in OPEN state
resilience4j.circuitbreaker.instances.deliveryCB.waitDurationInOpenState=10s

# Half Open Configuration
resilience4j.circuitbreaker.instances.deliveryCB.permittedNumberOfCallsInHalfOpenState=3

# Automatic transition
resilience4j.circuitbreaker.instances.deliveryCB.automaticTransitionFromOpenToHalfOpenEnabled=true

# Slow call configuration
resilience4j.circuitbreaker.instances.deliveryCB.slowCallDurationThreshold=2s
resilience4j.circuitbreaker.instances.deliveryCB.slowCallRateThreshold=50

spring.config.import=ConfigServer:http://localhost:8888
